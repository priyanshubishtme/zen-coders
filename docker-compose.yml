# Optional. Local demo stays `npm run dev`.
# Mongo contract tests:
#   docker compose up -d mongo
#   MONGODB_URI=mongodb://127.0.0.1:27017/accessfix_test npm run test:unit -w backend
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      STORE: mongo
      MONGODB_URI: mongodb://mongo:27017/accessfix
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: 'true'
    depends_on:
      - mongo
    profiles: ['stack']

volumes:
  mongo-data:
